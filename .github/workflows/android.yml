name: Android validation

on:
  push:
    branches: [main, 'feature/**', 'release/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Source and release gate tests
        run: |
          python -m unittest discover -s scripts/tests -v
          python scripts/check_release.py
      - name: Published local references (tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch origin 'refs/heads/release/*:refs/heads/release/*'
          python scripts/version_refs.py --check
      - name: Compile, unit tests and static analysis
        run: bash gradlew testDebugUnitTest assembleDebug assembleDebugAndroidTest assembleRelease lintDebug lintRelease --max-workers=2 --console=plain
      - name: Verify APK and generated schema history
        run: |
          python scripts/check_release.py --apk app/build/outputs/apk/debug/app-debug.apk --output build/release-validation/debug.json
          git diff --exit-code -- app/schemas
      - name: Build previous tagged release with the same CI debug key
        run: |
          python scripts/prepare_previous.py --output build/previous-source
          bash build/previous-source/gradlew -p build/previous-source assembleDebug --max-workers=2 --console=plain
          python scripts/check_release.py --apk app/build/outputs/apk/debug/app-debug.apk --previous-apk build/previous-source/app/build/outputs/apk/debug/app-debug.apk --output build/release-validation/update.json
      - uses: actions/upload-artifact@v4
        with:
          name: previous-apk
          path: build/previous-source/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/test-results/
            build/release-validation/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: emulator-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
          retention-days: 7

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [30, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: emulator-apks
          path: app/build/outputs/apk
      - uses: actions/download-artifact@v4
        with:
          name: previous-apk
          path: build/previous-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: python scripts/test_emulator.py --serial emulator-5554 --previous-apk build/previous-apk/app-debug.apk --output build/release-validation/api-${{ matrix.api }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-api-${{ matrix.api }}
          path: build/release-validation/
          retention-days: 14
